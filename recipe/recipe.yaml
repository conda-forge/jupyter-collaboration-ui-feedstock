# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"
  jupyterlab_min: "4.5.0"
  jupyterlab_max: "5.0"
  python_check_max: "3.14"
  grep: ${{ 'grep -iE' if unix else 'findstr /c' }}

package:
  name: jupyter-collaboration-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-collaboration-ui/jupyter_collaboration_ui-${{ version }}.tar.gz
  sha256: 835e818614eb39645f2f583a57b2246d8d1ecff4ffd2d481ab4a6f6b2c45b997

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - jupyterlab >=${{ jupyterlab_min }},<${{ jupyterlab_max }}
    - hatch-jupyter-builder >=0.5
    - hatchling >=1.4.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
  run_constraints:
    - jupyterlab >=${{ jupyterlab_min }},<${{ jupyterlab_max }}

tests:
  - python:
      imports: jupyter_collaboration_ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - jupyterlab
    script:
      - pip check
      - jupyter labextension list --debug
      - jupyter labextension list --debug 2>&1 | ${{ grep }} "collaboration-extension.*OK"

about:
  summary: JupyterLab/Jupyter Notebook 7+ extension providing user interface integration for real time collaboration
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - jupyter_collaboration_ui/labextension/static/third-party-licenses.json
  homepage: https://pypi.org/project/jupyter-collaboration-ui
  repository: https://github.com/jupyterlab/jupyter-collaboration
  documentation: https://jupyterlab-realtime-collaboration.readthedocs.io

extra:
  recipe-maintainers:
    - conda-forge/jupyter-collaboration
    - bollwyvl
